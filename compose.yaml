# Include generated-config inputs in each consumer's container configuration.
# Compose then recreates consumers when these values change.
x-config-environment: &config-environment
  PUBLIC_HOST: ${PUBLIC_HOST}
  WEB_PORT: ${WEB_PORT}
  GAME_PORT: ${GAME_PORT}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  API_INTERNAL_PORT: ${API_INTERNAL_PORT:-8000}
  GAME_INTERNAL_PORT: ${GAME_INTERNAL_PORT:-8001}
  MATCH_PORT_START: ${MATCH_PORT_START:-9000}
  MATCH_PORT_END: ${MATCH_PORT_END:-9063}
  SURVEV_CONFIG: ${SURVEV_CONFIG:-./survev-config.hjson}

x-server: &server
  image: survev-server:local
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: server
  init: true
  volumes:
    - ${DATA_DIR:-./data}/config:/config

services:
  configure:
    <<: *server
    user: "0:0"
    command: ["configure"]
    volumes:
      - ${DATA_DIR:-./data}/config:/config
      - ${DATA_DIR:-./data}/lost-games:/app/server/lost_game_data
    environment: *config-environment
    secrets:
      - survev_config

  db:
    profiles: ["local"]
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: survev
      POSTGRES_DB: survev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survev -d survev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["local"]
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["local"]
    <<: *server
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: api
      # The migration CLI imports source config.ts, not the production bundle.
      NODE_ENV: development
    depends_on:
      configure:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  api:
    <<: *server
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: api
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      configure:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10

  game:
    <<: *server
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/gameServer.js"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: game
    volumes:
      - ${DATA_DIR:-./data}/config:/config
      - ${DATA_DIR:-./data}/lost-games:/app/server/lost_game_data
    ports:
      - "${GAME_PORT}:${GAME_INTERNAL_PORT:-8001}"
      - "${MATCH_PORT_START:-9000}-${MATCH_PORT_END:-9063}:${MATCH_PORT_START:-9000}-${MATCH_PORT_END:-9063}"
    depends_on:
      configure:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    <<: *server
    profiles: ["bot"]
    restart: unless-stopped
    working_dir: /app/bot
    command: ["pnpm", "start"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: api
      # Like migrations, the bot imports source config.ts rather than a bundle.
      NODE_ENV: development
    depends_on:
      configure:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      # Secret contents do not invalidate build cache; always rebuild on --build.
      no_cache: true
      args:
        PUBLIC_HOST: ${PUBLIC_HOST}
        WEB_PORT: ${WEB_PORT}
        GAME_PORT: ${GAME_PORT}
        CLIENT_BUILD_CPUSET: ${CLIENT_BUILD_CPUSET:-}
        VITE_ENABLE_SURVEV_ADS: ${VITE_ENABLE_SURVEV_ADS:-false}
        VITE_NITROPAY_SITE_ID: ${VITE_NITROPAY_SITE_ID:-}
        VITE_BUILD_FOR_SPELLSYNC: ${VITE_BUILD_FOR_SPELLSYNC:-false}
      secrets:
        - survev_config
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:${API_INTERNAL_PORT:-8000}}

secrets:
  survev_config:
    file: ${SURVEV_CONFIG:-./survev-config.hjson}

