# Include generated-config inputs in each consumer's container configuration.
# Compose then recreates consumers when these values change.
x-config-environment: &config-environment
  PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
  WEB_PORT: ${WEB_PORT:-8080}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survev}

x-server: &server
  image: survev-server:local
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: server
  init: true
  volumes:
    - ./data/config:/config

services:
  configure:
    <<: *server
    user: "0:0"
    command: ["sh", "/app/docker/configure.sh"]
    volumes:
      - ./data/config:/config
      - ./data/lost-games:/app/server/lost_game_data
    environment: *config-environment

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: survev
      POSTGRES_DB: survev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survev}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survev -d survev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *server
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: api
      # The migration CLI imports source config.ts, not the production bundle.
      NODE_ENV: development
    depends_on:
      configure:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  api:
    <<: *server
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: api
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/site_info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  game:
    <<: *server
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/gameServer.js"]
    environment:
      <<: *config-environment
      CONFIG_ROLE: game
    volumes:
      - ./data/config:/config
      - ./data/lost-games:/app/server/lost_game_data
    ports:
      - "8001:8001"
      - "9000-9063:9000-9063"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
        WEB_PORT: ${WEB_PORT:-8080}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      game:
        condition: service_healthy

